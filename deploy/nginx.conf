# travel Nginx 配置 —— 静态站点 + /api 反代到 Node 后端(8766)
# 用法: sudo cp deploy/nginx.conf /etc/nginx/sites-available/travel
#       sudo ln -sf /etc/nginx/sites-available/travel /etc/nginx/sites-enabled/travel
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;   # ← 改成你的域名

    # 前端静态产物(Vite build → dist/)
    root /home/youruser/travel/dist;
    index index.html;

    # 前端路由 SPA fallback(BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API(交通 / 快照 / LLM 代理 / 高德代理)反代到 Node
    location /api/ {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 交通查询(python 子进程)可能较慢,放宽超时
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 生成/静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}

# 若已是 HTTPS,可用 certbot 自动补 443 段;
# certbot --nginx -d your-domain.com 会自动改写本文件。
